<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}موقعي الاحترافي{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <a href="{{ url_for('index') }}" class="logo">جولز للبرمجة</a>
            <ul>
                <li><a href="{{ url_for('index') }}">الرئيسية</a></li>
                <li><a href="{{ url_for('about') }}">من نحن</a></li>
                <li><a href="{{ url_for('contact') }}">اتصل بنا</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 موقع جولز الاحترافي. جميع الحقوق محفوظة.</p>
        </div>
    </footer>
</body>
</html>
