<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}المخطط الرقمي | بورتفوليو مهندس المساحة{% endblock %}</title>

    <!-- Google Fonts: Orbitron for Headings, Rajdhani for Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons (optional, but good to have) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- Main JavaScript file (will be created later) -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
