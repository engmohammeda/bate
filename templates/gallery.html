{% extends "layout.html" %}

{% block title %}
معرض الصور - بورتفوليو مهندس المساحة
{% endblock %}

{% block content %}
<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
    }
    .gallery-item {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        position: relative;
        cursor: pointer;
    }
    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
        transform: scale(1.1);
    }
    .gallery-item .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 35, 66, 0.7);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.4s ease;
        font-size: 1.5rem;
    }
    .gallery-item:hover .overlay {
        opacity: 1;
    }

    /* Lightbox Modal */
    .lightbox {
        display: none;
        position: fixed;
        z-index: 2000;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
    }
    .lightbox img {
        max-width: 90%;
        max-height: 80%;
    }
    .lightbox .close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
    }
</style>

<section>
    <div class="container">
        <h2 style="text-align: center;">لقطات من الميدان</h2>
        <p style="text-align: center; max-width: 700px; margin: 0 auto 3rem auto;">مجموعة من الصور التي توثق لحظات العمل في مختلف المشاريع، من دقة الأجهزة إلى ضخامة الإنجازات.</p>

        <div class="gallery-grid reveal">
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1618060932014-4deda4932554?w=600&q=80" alt="مهندس في الموقع">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1581094482453-91b3b2f0a624?w=600&q=80" alt="معدات مسح">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1508450859948-476321223942?w=600&q=80" alt="طريق سريع">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1608229342417-a4caf9f8d951?w=600&q=80" alt="موقع بناء">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1589939705384-5185137a7f0f?w=600&q=80" alt="عمال بناء">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
             <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1535722233560-421629491453?w=600&q=80" alt="مخططات هندسية">
                <div class="overlay"><i class="fas fa-search-plus"></i></div>
            </div>
        </div>
    </div>
</section>

<!-- The Lightbox Modal -->
<div id="myLightbox" class="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <img id="lightboxImage" src="" alt="صورة مكبرة">
</div>

<script>
    function openLightbox(element) {
        const lightbox = document.getElementById('myLightbox');
        const lightboxImg = document.getElementById('lightboxImage');
        lightbox.style.display = "flex";
        lightboxImg.src = element.getElementsByTagName('img')[0].src;
    }

    function closeLightbox() {
        document.getElementById('myLightbox').style.display = "none";
    }
</script>
{% endblock %}
